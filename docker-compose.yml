services:
  meridian:
    build:
      context: .
      dockerfile: Dockerfile.dev
    ports:
      - "5173:5173" # Frontend (Vite HMR)
      - "3000:3000" # Backend
    volumes:
      - .:/app
      - /app/node_modules # Protege o node_modules do container (evita sobrescrever com o local)
      - meridian_data:/app/.meridian
    environment:
      - GEMINI_API_KEY=${GEMINI_API_KEY}
      - CHOKIDAR_USEPOLLING=true # Garante que o hot reload funcione em todos os sistemas
    restart: unless-stopped

volumes:
  meridian_data:
