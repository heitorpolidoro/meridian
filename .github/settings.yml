_extends: .github
repository:
  name: meridian
  description: Meridian AI Manager
  topics: ai, manager, automation, orchestration, typescript, nodejs
  has_projects: true

branches:
  - name: master
    protection:
      required_status_checks:
        strict: true
        contexts:
          - "GitGuardian Security Checks"
          - "SonarCloud"
          - "SonarCloud Code Analysis"
          - "DeepSource: Test coverage"
          - "DeepSource: Secrets"
          - "DeepSource: JavaScript"
          - "test (22.x)"
          - "test (24.x)"
